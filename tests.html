<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ОПОРА 365 · тести</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: calc(env(safe-area-inset-top) + 20px) 16px 40px; background: #080D16; color: #F4F7FB; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p { margin: 0 0 16px; opacity: .75; }
    ol { padding-left: 1.4em; line-height: 1.45; }
    li { margin: 6px 0; }
    .ok::marker { color: #58DCC5; }
    .bad { color: #FF8F87; }
    .sum { font-weight: 700; font-size: 1.1rem; }
    a { color: #63D8FF; }
  </style>
</head>
<body>
  <h1>Тести логіки ОПОРА 365</h1>
  <p>Перевіряють час виходу, режими, наступну дію, повторювані справи, екіпірування, сценарії, посилання, міграцію і резервні копії саме в цьому браузері.</p>
  <p class="sum" id="sum">Виконую…</p>
  <ol id="list"></ol>
  <p><a href="./">← До застосунку</a></p>
  <script type="module">
    import { run } from './tests.js';
    import { count } from './time.js';
    const results = run();
    const failed = results.filter((r) => !r.ok).length;
    document.getElementById('sum').textContent = failed ? `Помилок: ${failed} з ${results.length}` : `Усі тести пройдено: ${count(results.length, ['тест', 'тести', 'тестів'])} ✓`;
    document.getElementById('sum').className = failed ? 'sum bad' : 'sum';
    document.getElementById('list').innerHTML = results.map((r) => `<li class="${r.ok ? 'ok' : 'bad'}">${r.name.replace(/</g, '&lt;')}${r.ok ? '' : ` — ${r.error.replace(/</g, '&lt;')}`}</li>`).join('');
  </script>
</body>
</html>
