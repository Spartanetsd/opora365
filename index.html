<!doctype html>
<html lang="uk">
<head>

  <meta name="referrer" content="no-referrer">

  <meta name="description" content="Ранковий план із часом виходу, справи за пріоритетами та обов’язкові справи, що не зникають до виконання. Працює офлайн.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">

  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="view" class="view" tabindex="-1"></main>

  <header class="topbar">

      <span class="tb-side"></span>
      <span class="tb-title" id="tbTitle" aria-hidden="true">Мій день</span>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="sheet" class="sheet" aria-label="Панель"></dialog>
  <dialog id="session" class="screen" aria-label="Ранкова підготовка"></dialog>
